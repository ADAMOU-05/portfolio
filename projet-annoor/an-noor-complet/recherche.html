<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09130f"><meta name="description" content="Recherche dans le Coran en français avec An•Noor.">
<title>Recherche coranique — An•Noor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09130f;--panel:#11221a;--gold:#d6b779;--text:#f1eee5;--muted:#a9b4aa;--line:rgba(214,183,121,.22)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,rgba(35,75,51,.24),transparent 48%),var(--bg);color:var(--text);font:16px/1.7 "DM Sans",Arial,sans-serif}
a{color:inherit}.top{position:sticky;top:0;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px max(18px,calc((100% - 1000px)/2));background:rgba(9,19,15,.94);border-bottom:1px solid var(--line);z-index:2}.brand{color:var(--gold);font-weight:700;text-decoration:none}.pill,button{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--panel);color:var(--text);text-decoration:none;cursor:pointer;font:inherit}
main{width:min(1000px,calc(100% - 28px));margin:42px auto 90px}.hero{text-align:center;margin-bottom:30px}.kicker{color:var(--gold);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}h1{font-size:clamp(2rem,5vw,3.3rem);margin:6px 0}.muted{color:var(--muted)}form{display:flex;gap:10px;max-width:760px;margin:22px auto}input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--panel);color:var(--text);font:inherit}form button{background:var(--gold);color:#09130f;font-weight:700}.status{min-height:1.5em;color:var(--muted);text-align:center}.result{padding:22px;margin:14px 0;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.ref{color:var(--gold);font-size:.88rem;font-weight:700}.arabic{font:2rem/2 "Amiri",serif;direction:rtl;text-align:right}.translation{color:#dce3dc}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{padding:7px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:.85rem}
@media(max-width:600px){form{flex-direction:column}.top{padding:12px 14px}main{margin-top:25px}.arabic{font-size:1.7rem}}
</style></head><body>
<header class="top"><a class="brand" href="index.html">An•Noor · النور</a><nav style="display:flex;gap:8px;flex-wrap:wrap"><a class="pill" href="lire.html">Lire le Coran</a><a class="pill" href="index.html">Accueil</a></nav></header>
<main><section class="hero"><p class="kicker">Retrouver un passage</p><h1>Recherche dans le Coran</h1><p class="muted">Recherche un mot ou une expression dans la traduction française disponible.</p></section>
<form id="searchForm"><input id="query" type="search" required minlength="2" placeholder="Ex. : miséricorde, patience, lumière…" aria-label="Mot ou expression à rechercher"><button type="submit">Rechercher</button></form>
<p id="status" class="status" role="status" aria-live="polite">Entre au moins deux caractères pour commencer.</p><section id="results" aria-label="Résultats de recherche"></section></main>
<script>
(() => {
 const form=document.getElementById("searchForm"), input=document.getElementById("query"), status=document.getElementById("status"), results=document.getElementById("results");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 form.addEventListener("submit",async e=>{
  e.preventDefault(); const q=input.value.trim(); if(q.length<2)return;
  status.textContent="Recherche en cours…";results.replaceChildren();
  try{
   const response=await fetch("https://api.alquran.cloud/v1/search/"+encodeURIComponent(q)+"/all/fr.hamidullah");
   if(!response.ok)throw new Error();
   const json=await response.json(); if(json.code!==200)throw new Error();
   const matches=json.data.matches||[];
   if(!matches.length){status.textContent="Aucun résultat trouvé. Essaie un autre mot.";return;}
   status.textContent=matches.length+" résultat(s) trouvé(s).";
   results.innerHTML=matches.slice(0,80).map(m=>{
    const surah=m.surah||{}; const surahNo=surah.number||1; const ayahNo=m.numberInSurah||1;
    return `<article class="result"><div class="ref">${esc(surah.englishName||"Sourate")} · ${surahNo}:${ayahNo}</div><p class="translation">${esc(m.text)}</p><div class="actions"><a href="lire.html?surah=${surahNo}#ayah-${ayahNo}">Ouvrir ce verset dans le lecteur ↗</a><a href="https://quran.com/${surahNo}/${ayahNo}" target="_blank" rel="noopener noreferrer">Comparer la référence ↗</a></div></article>`;
   }).join("");
  }catch{status.textContent="La recherche est momentanément indisponible. Vérifie ta connexion puis réessaie.";}
 });
})();
</script></body></html>
